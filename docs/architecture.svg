<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowIn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1360" height="900" fill="url(#bg)"/>

  <!-- title -->
  <text x="36" y="52" fill="#e2e8f0" font-size="27" font-weight="700">Excalidraw × DSH 桥接架构</text>
  <text x="36" y="80" fill="#94a3b8" font-size="13">网页本身不发跨域请求：由 Chrome 扩展的三层世界做“设备驱动”，经本地回环 HTTP 接入 DSH Host 里的 Cordis 插件</text>

  <!-- ================= ① Chrome ================= -->
  <rect x="28" y="108" width="432" height="626" rx="16" fill="#111c33" stroke="#2563eb" stroke-width="1.4"/>
  <text x="48" y="140" fill="#93c5fd" font-size="17" font-weight="700">① Chrome · excalidraw.com 标签页</text>
  <text x="48" y="161" fill="#64748b" font-size="12">扩展有三个执行世界，权限各不相同</text>

  <!-- page.js -->
  <rect x="48" y="176" width="392" height="150" rx="10" fill="#0f2440" stroke="#3b82f6" stroke-width="1"/>
  <text x="64" y="200" fill="#dbeafe" font-size="15" font-weight="700">page.js</text>
  <text x="132" y="200" fill="#60a5fa" font-size="12">MAIN world · 页面自己的 JS 世界</text>
  <text x="64" y="224" fill="#cbd5e1" font-size="12.5">React fiber → Excalidraw App 实例</text>
  <text x="64" y="245" fill="#cbd5e1" font-size="12.5">getSceneElements / getAppState（选区·视口）</text>
  <text x="64" y="266" fill="#cbd5e1" font-size="12.5">updateScene（可撤销）/ selection / canvas PNG</text>
  <text x="64" y="287" fill="#cbd5e1" font-size="12.5">极简 postMessage 协议：scene.get · apply · png</text>
  <text x="64" y="308" fill="#64748b" font-size="11.5">唯一能碰到页面 window / React 内部对象的层</text>

  <!-- content.js -->
  <rect x="48" y="348" width="392" height="150" rx="10" fill="#0f2440" stroke="#3b82f6" stroke-width="1"/>
  <text x="64" y="372" fill="#dbeafe" font-size="15" font-weight="700">content.js</text>
  <text x="146" y="372" fill="#60a5fa" font-size="12">isolated world · 与页面隔离</text>
  <text x="64" y="396" fill="#cbd5e1" font-size="12.5">浮动按钮 + 聊天面板（Shadow DOM）</text>
  <text x="64" y="417" fill="#cbd5e1" font-size="12.5">范围胶囊 · 工作区选择 · 消息渲染</text>
  <text x="64" y="438" fill="#cbd5e1" font-size="12.5">收集画板上下文，轮询对话帧</text>
  <text x="64" y="459" fill="#cbd5e1" font-size="12.5">通过 chrome.runtime 与后台通信</text>
  <text x="64" y="480" fill="#64748b" font-size="11.5">唯一有 chrome.* API、又不被页面 CSS/JS 干扰的层</text>

  <!-- background.js -->
  <rect x="48" y="520" width="392" height="150" rx="10" fill="#0f2440" stroke="#3b82f6" stroke-width="1"/>
  <text x="64" y="544" fill="#dbeafe" font-size="15" font-weight="700">background.js</text>
  <text x="190" y="544" fill="#60a5fa" font-size="12">MV3 service worker · 扩展 origin</text>
  <text x="64" y="568" fill="#cbd5e1" font-size="12.5">端口发现：扫描 127.0.0.1:46231..46250</text>
  <text x="64" y="589" fill="#cbd5e1" font-size="12.5">长轮询页面操作 · 代理聊天 / 消息 / 工作区请求</text>
  <text x="64" y="610" fill="#cbd5e1" font-size="12.5">截图前临时把画板标签页切到前台</text>
  <text x="64" y="631" fill="#cbd5e1" font-size="12.5">host_permissions 放行 127.0.0.1 → 不受页面 CORS 限制</text>
  <text x="64" y="652" fill="#64748b" font-size="11.5">唯一能常驻后台、跨域访问本地端口的层</text>

  <!-- in-browser arrows -->
  <path d="M244,326 L244,348" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrowIn)"/>
  <text x="256" y="342" fill="#94a3b8" font-size="10.5">window.postMessage</text>
  <path d="M244,498 L244,520" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrowIn)"/>
  <text x="256" y="514" fill="#94a3b8" font-size="10.5">chrome.runtime</text>

  <!-- ================= bridge ================= -->
  <rect x="504" y="238" width="312" height="366" rx="14" fill="#1c1608" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="524" y="270" fill="#fcd34d" font-size="17" font-weight="700">② 本地回环 HTTP 桥</text>
  <text x="524" y="294" fill="#fbbf24" font-size="13" font-family="Consolas, monospace">127.0.0.1:46231..46250</text>
  <text x="524" y="315" fill="#a16207" font-size="11.5">固定端口段，扩展可稳定发现（DSH Web 端口是随机的）</text>

  <rect x="520" y="330" width="280" height="150" rx="8" fill="#241b0a" stroke="#92400e" stroke-width="1"/>
  <text x="536" y="352" fill="#fde68a" font-size="12.5" font-weight="700">上行（页面 → DSH）</text>
  <text x="536" y="375" fill="#fcd34d" font-size="11.5" font-family="Consolas, monospace">/start   建会话 + 上下文 + 第一句</text>
  <text x="536" y="396" fill="#fcd34d" font-size="11.5" font-family="Consolas, monospace">/message 追加用户消息</text>
  <text x="536" y="417" fill="#fcd34d" font-size="11.5" font-family="Consolas, monospace">/chat    长轮询会话日志 → 聊天帧</text>
  <text x="536" y="438" fill="#fcd34d" font-size="11.5" font-family="Consolas, monospace">/poll /result   页面操作队列</text>
  <text x="536" y="459" fill="#fcd34d" font-size="11.5" font-family="Consolas, monospace">/scope /workspaces /open /interrupt</text>

  <text x="536" y="500" fill="#fde68a" font-size="12.5" font-weight="700">下行（DSH → 页面）</text>
  <text x="536" y="522" fill="#fcd34d" font-size="11.5" font-family="Consolas, monospace">工具调用 → 操作队列 → 扩展取走</text>
  <text x="536" y="543" fill="#fcd34d" font-size="11.5" font-family="Consolas, monospace">→ scene.apply → updateScene(...)</text>
  <text x="536" y="564" fill="#fcd34d" font-size="11.5" font-family="Consolas, monospace">聊天帧 ← 会话日志投影 + 工具结果</text>
  <text x="536" y="590" fill="#a16207" font-size="11">协议：纯 HTTP（仅 loopback）· 无 token（已知限制）</text>

  <!-- browser -> bridge -->
  <path d="M436,262 L504,262" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowUp)"/>
  <text x="444" y="252" fill="#60a5fa" font-size="11.5">① 上行</text>
  <path d="M504,470 L436,470" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="438" y="460" fill="#f59e0b" font-size="11.5">③ 下行</text>

  <!-- ================= DSH ================= -->
  <rect x="852" y="108" width="480" height="626" rx="16" fill="#101b17" stroke="#22c55e" stroke-width="1.4"/>
  <text x="872" y="140" fill="#86efac" font-size="17" font-weight="700">③ DSH Desktop · Host 进程（静默后台）</text>
  <text x="872" y="161" fill="#64748b" font-size="12">不打开窗口、不抢焦点；网页通过桥与这里的服务对话</text>

  <!-- plugin -->
  <rect x="872" y="176" width="440" height="196" rx="10" fill="#0f2a1e" stroke="#22c55e" stroke-width="1"/>
  <text x="888" y="200" fill="#dcfce7" font-size="15" font-weight="700">Cordis 插件 dsh-excalidraw-bridge</text>
  <text x="888" y="224" fill="#bbf7d0" font-size="12.5">HTTP 桥对端：路由 · 操作队列 · 会话绑定</text>
  <text x="888" y="246" fill="#bbf7d0" font-size="12.5">5 个实时工具：</text>
  <text x="904" y="267" fill="#86efac" font-size="11.5" font-family="Consolas, monospace">excalidraw_get_scene / apply / screenshot</text>
  <text x="904" y="287" fill="#86efac" font-size="11.5" font-family="Consolas, monospace">excalidraw_select / status</text>
  <text x="888" y="310" fill="#bbf7d0" font-size="12.5">会话创建 · 聊天投影 · 范围白名单</text>
  <text x="888" y="331" fill="#bbf7d0" font-size="12.5">工作区查询 / 注册（workspaceRegistry）</text>
  <text x="888" y="354" fill="#64748b" font-size="11">零外部依赖：内置 defineTool（本地目录安装也不怕解析失败）</text>

  <!-- session -->
  <rect x="872" y="392" width="440" height="156" rx="10" fill="#0f2a1e" stroke="#22c55e" stroke-width="1"/>
  <text x="888" y="416" fill="#dcfce7" font-size="15" font-weight="700">DSH 会话 = Agent + 会话日志</text>
  <text x="888" y="440" fill="#bbf7d0" font-size="12.5">sessionController.create() / prompt() / inspect()</text>
  <text x="888" y="461" fill="#bbf7d0" font-size="12.5">模型每一轮的工具调用与结果都写进日志</text>
  <text x="888" y="482" fill="#bbf7d0" font-size="12.5">会话挂在工作区下 → DSH 侧栏可见</text>
  <text x="888" y="503" fill="#86efac" font-size="12.5">同一份会话：面板和 DSH GUI 是两个前端</text>
  <text x="888" y="526" fill="#64748b" font-size="11">懒创建：第一次发送才 create，点开面板不消耗模型调用</text>

  <!-- web gui -->
  <rect x="872" y="568" width="440" height="134" rx="10" fill="#0f2a1e" stroke="#22c55e" stroke-width="1"/>
  <text x="888" y="592" fill="#dcfce7" font-size="15" font-weight="700">DSH Web GUI · client.js</text>
  <text x="888" y="616" fill="#bbf7d0" font-size="12.5">长轮询 /excalidraw/pending</text>
  <text x="888" y="637" fill="#bbf7d0" font-size="12.5">点面板「↗」→ 插件推 pending 事件</text>
  <text x="888" y="658" fill="#bbf7d0" font-size="12.5">uiWorkspace.openSession(会话) → 切到该会话</text>
  <text x="888" y="681" fill="#64748b" font-size="11">仅“显式打开”时发生；默认全程静默</text>

  <!-- plugin <-> gui -->
  <path d="M1092,546 L1092,568" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrowIn)"/>
  <text x="1104" y="562" fill="#94a3b8" font-size="10.5">pending → openSession</text>

  <!-- bridge -> host -->
  <path d="M816,262 L872,262" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowUp)"/>
  <path d="M872,470 L816,470" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- bottom flow -->
  <rect x="28" y="756" width="1304" height="118" rx="12" fill="#0c1424" stroke="#334155" stroke-width="1"/>
  <text x="48" y="782" fill="#cbd5e1" font-size="14" font-weight="700">一次“帮我改画板”的完整路径</text>
  <text x="48" y="808" fill="#93c5fd" font-size="12.5">① 面板输入 → POST /start（画板快照 + 选中范围 + 第一句）</text>
  <text x="48" y="830" fill="#86efac" font-size="12.5">② 插件 create + prompt → 会话跑一轮，模型先读场景/截图</text>
  <text x="48" y="852" fill="#fcd34d" font-size="12.5">③ 模型调工具 → 操作队列 → 扩展轮询 → updateScene → 画板变化（可 Ctrl+Z）</text>

  <text x="700" y="808" fill="#fcd34d" font-size="12.5">④ excalidraw_screenshot → PNG 落盘 → 模型 read_image 自查</text>
  <text x="700" y="830" fill="#93c5fd" font-size="12.5">⑤ /chat 投影会话日志 → 面板消息流（用户/助手/工具/错误）</text>
  <text x="700" y="852" fill="#bbf7d0" font-size="12.5">⑥ 点「↗」→ /open → pending → DSH GUI 切到同一会话</text>

  <!-- legend -->
  <line x1="1060" y1="782" x2="1100" y2="782" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowUp)"/>
  <text x="1108" y="786" fill="#94a3b8" font-size="11.5">页面上行</text>
  <line x1="1180" y1="782" x2="1220" y2="782" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="1228" y="786" fill="#94a3b8" font-size="11.5">DSH 下行</text>
</svg>
